<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content accessibility demo</title>
    <link rel="stylesheet" href="/core/webcomponent.min.css" />
    <style>
      body { margin: 0; padding: 24px 16px 64px; font: 15px/1.5 system-ui, sans-serif; background: #f4f4f7; color: #1d1d24; }
      main { max-width: 820px; margin: 0 auto; display: grid; gap: 12px; }
      h1 { font-size: 22px; margin: 0; }
      p.lead { margin: 0; color: #5d5d6b; }
      h2.section { font-size: 15px; margin: 12px 0 0; }
      #plain { padding: 12px 16px; background: #fff; border: 1px solid #d0d0d8; border-radius: 8px; }
      output { font-size: 13px; color: #45454f; }
    </style>
  </head>
  <body>
    <main>
      <h1>Content accessibility</h1>
      <p class="lead">Press the accessibility button in the toolbar. Markers point at problems; open one to see why it matters and fix it. Fixes can be undone.</p>
      <h2 class="section">Editora</h2>
      <div id="editor-slot"></div>
      <h2 class="section">Any contenteditable</h2>
      <output id="status" aria-live="polite"></output>
      <div id="plain" contenteditable="true" aria-label="Plain editor"></div>
    </main>
    <script type="module">
      const sample = await (await fetch('/fixtures/problems.html')).text();
      const plain = document.getElementById('plain');
      plain.innerHTML = sample;

      await import('/core/webcomponent.js');
      const { attachContentChecker } = await import('/dist/index.js');
      const { ContentA11yPlugin } = await import('/dist/editora.js');

      // Configure the editor before it joins the page, so it is built once, with this configuration.
      const editor = document.createElement('editora-editor');
      editor.id = 'editor';
      editor.setAttribute('height', '420');
      editor.innerHTML = sample;
      await editor.setConfig({
        plugins: ['heading', 'bold', 'italic', 'underline', 'list', 'link', 'table', 'history', ContentA11yPlugin({ minHeadingLevel: 2 })],
        toolbar: 'undo redo | heading bold italic underline | bullist numlist | link table | toggleContentA11y',
      });
      document.getElementById('editor-slot').replaceWith(editor);

      const status = document.getElementById('status');
      window.plainChecker = attachContentChecker(plain, {
        minHeadingLevel: 2,
        onChange: (result) => (status.textContent = `${result.errors} errors, ${result.warnings} warnings, ${result.infos} suggestions`),
      });
    </script>
  </body>
</html>
