<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paste cleaner demo</title>
    <link rel="stylesheet" href="/core/webcomponent.min.css" />
    <style>
      body { margin: 0; padding: 24px 16px 64px; font: 15px/1.5 system-ui, sans-serif; background: #f4f4f7; color: #1d1d24; }
      main { max-width: 820px; margin: 0 auto; display: grid; gap: 16px; }
      h1 { font-size: 22px; margin: 0; }
      p.lead { margin: 0; color: #5d5d6b; }
      .samples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .samples button { font: inherit; padding: 6px 12px; border: 1px solid #c9c9d3; border-radius: 6px; background: #fff; cursor: pointer; }
      .samples button:hover { background: #eef; }
      .samples button:focus-visible { outline: 2px solid #5b4bdb; outline-offset: 1px; }
      #plain { min-height: 120px; padding: 12px 16px; background: #fff; border: 1px solid #d0d0d8; border-radius: 8px; }
      #plain:focus-visible { outline: 2px solid #5b4bdb; }
      output { display: block; font-size: 13px; color: #5d5d6b; min-height: 1.5em; }
      h2 { font-size: 15px; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Paste cleaner</h1>
      <p class="lead">Paste from Word, Google Docs, Sheets, Excel, Pages, a web page or Markdown, or use a sample below. <kbd>Shift</kbd>+<kbd>Ctrl/⌘</kbd>+<kbd>V</kbd> pastes plain text.</p>
      <div class="samples" role="group" aria-label="Paste a sample into the editor">
        <span>Paste a sample:</span>
        <button type="button" data-sample="word-desktop.html">Word</button>
        <button type="button" data-sample="word-online.html">Word for the web</button>
        <button type="button" data-sample="google-docs.html">Google Docs</button>
        <button type="button" data-sample="sheets">Google Sheets</button>
        <button type="button" data-sample="excel">Excel</button>
        <button type="button" data-sample="apple-textedit.html">Pages / TextEdit</button>
        <button type="button" data-sample="web-chrome.html">Web page</button>
        <button type="button" data-sample="markdown">Markdown</button>
      </div>
      <output id="status" aria-live="polite"></output>
      <h2>Editora</h2>
      <editora-editor id="editor" height="360" plugins="heading bold italic underline strikethrough list link table history">
        <p>Click here, then paste.</p>
      </editora-editor>
      <h2>Any contenteditable</h2>
      <div id="plain" contenteditable="true" aria-label="Plain editor"><p>Or paste here.</p></div>
    </main>
    <script type="module">
      import '/core/webcomponent.js';
      import { attachPasteCleaner } from '/dist/index.js';
      import { PasteCleanerPlugin } from '/dist/editora.js';

      const status = document.getElementById('status');
      const report = (result) => {
        status.textContent = `Cleaned a paste from ${result.source}.${result.warnings.length ? ' ' + result.warnings.join(' ') : ''}`;
      };

      const editor = document.getElementById('editor');
      const configure = () =>
        editor.setConfig({
          plugins: ['heading', 'bold', 'italic', 'underline', 'strikethrough', 'list', 'link', 'table', 'history', PasteCleanerPlugin({ onPaste: report })],
          toolbar: 'undo redo | heading bold italic underline strikethrough | bullist numlist | link table',
        });
      customElements.whenDefined('editora-editor').then(configure);

      attachPasteCleaner(document.getElementById('plain'), { onPaste: report });

      const markdown = '## Release notes\n\nThis release **cleans pastes** from *anywhere*. See [the docs](https://editora-ecosystem.netlify.app/).\n\n- Word lists become real lists\n  - nested ones too\n- Google Docs bold wrapper removed\n\n| Source | Fixed |\n|---|---|\n| Word | lists |\n| Sheets | tables |\n\n```js\nconst { html } = cleanPaste(clipboard);\n```';

      async function sampleData(name) {
        if (name === 'markdown') return { 'text/plain': markdown };
        const file = name === 'sheets' || name === 'excel' ? 'sheets-excel.html' : name;
        let html = await (await fetch(`/fixtures/${file}`)).text();
        if (name === 'sheets') html = html.split('<!-- excel -->')[0];
        if (name === 'excel') html = html.split('<!-- excel -->')[1];
        return { 'text/html': html, 'text/plain': '' };
      }

      // Last editable the user was in, so a sample goes where they were typing.
      let target = null;
      const remember = (node) => {
        const element = node?.nodeType === 1 ? node : node?.parentElement;
        const editable = element?.closest?.('[contenteditable="true"]');
        if (editable) target = editable;
      };
      document.addEventListener('focusin', (event) => remember(event.target));
      document.addEventListener('selectionchange', () => remember(getSelection().anchorNode));

      document.querySelector('.samples').addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-sample]');
        if (!button) return;
        const editable = target ?? document.querySelector('.editora-content');
        editable.focus();
        const selection = getSelection();
        if (!selection.rangeCount || !editable.contains(selection.anchorNode)) {
          const range = document.createRange();
          range.selectNodeContents(editable);
          range.collapse(false);
          selection.removeAllRanges();
          selection.addRange(range);
        }
        const data = new DataTransfer();
        for (const [type, value] of Object.entries(await sampleData(button.dataset.sample))) if (value) data.setData(type, value);
        editable.dispatchEvent(new ClipboardEvent('paste', { clipboardData: data, bubbles: true, cancelable: true }));
      });
    </script>
  </body>
</html>
