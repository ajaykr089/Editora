name: Publish to npm

on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Install dependencies
        run: npm ci

      - name: Verify component registry is up to date
        run: npm run check:components

      - name: Verify custom element registrations are complete
        run: npm run check:element-registrations

      - name: Run tests
        run: npm test

      - name: Run UI package tests
        run: npm run test:ui

      - name: Run icons, react-icons and toast tests
        run: npm run test:libs

      # ui-core, ui-react, ui-sortable and collaboration each have a vitest suite that nothing ran
      # here (test:ui only type-checks the declarations), so regressions in them went unnoticed.
      - name: Run ui-core and ui-react unit tests
        run: npm run test:ui:unit

      - name: Run ui-sortable and collaboration tests
        run: npm run test:packages

      # `changeset publish` packs whatever is on disk and dist/ is not committed, so every
      # workspace has to be built here or it is published empty (36 plugin packages were in the
      # 2026-10-02 release). verify:release below only builds a subset.
      - name: Build all packages
        run: npm run build

      - name: Generate plugin typings
        run: npm run build:types

      - name: Verify package contents
        run: npm run verify:packages

      - name: Verify release artifacts
        run: npm run verify:release

      - name: Check for pending changesets
        id: check
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.check.outputs.has_changesets == 'true'
        run: npm run version-packages

      - name: Commit version bump
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          git add -A
          git commit -m "chore(release): version packages"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish to npm
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Push release tags
        run: git push origin --tags

      # Checks the artifacts npm actually serves, not the working tree: `npm publish` re-runs lifecycle
      # hooks (prepare / prepublishOnly) after the pre-publish check, which is how
      # @editora/ui-editor@0.1.6 shipped without its typings. Runs after the tags are pushed so a
      # failure here flags the run without leaving a published-but-untagged release. The versions are
      # already on npm by now; a red step names the ones to fix and deprecate.
      - name: Verify published packages
        run: npm run verify:published
