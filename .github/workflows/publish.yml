name: Publish to npm

on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Install dependencies
        run: npm ci

      - name: Verify component registry is up to date
        run: npm run check:components

      - name: Run tests
        run: npm test

      - name: Run UI package tests
        run: npm run test:ui

      - name: Verify release artifacts
        run: npm run verify:release

      - name: Check for pending changesets
        id: check
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.check.outputs.has_changesets == 'true'
        run: npm run version-packages

      - name: Commit version bump
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          git add -A
          git commit -m "chore(release): version packages"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish to npm
        if: steps.check.outputs.has_changesets == 'true'
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Push release tags
        if: steps.check.outputs.has_changesets == 'true'
        run: git push origin --tags

      - name: No pending changesets
        if: steps.check.outputs.has_changesets == 'false'
        run: echo "No .changeset/*.md files found - nothing to version or publish."
