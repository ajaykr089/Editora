name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify component registry is up to date
        run: npm run check:components

      - name: Verify custom element registrations are complete
        run: npm run check:element-registrations

      - name: Run linter
        run: npm run lint
      
      - name: Run type checking
        run: npm run typecheck
      
      - name: Build packages
        run: npm run build

      - name: Test release scripts
        run: npm run test:scripts

      - name: Generate plugin typings
        run: npm run build:types

      - name: Verify package contents
        run: npm run verify:packages
      
      - name: Run tests
        run: npm test

      - name: Run UI package tests
        run: npm run test:ui

      - name: Run core package tests
        run: npm run test:core:unit

      - name: Run icons, react-icons and toast tests
        run: npm run test:libs

      # ui-core, ui-react, ui-sortable and collaboration each have a vitest suite that nothing ran
      # here (test:ui only type-checks the declarations), so regressions in them went unnoticed.
      - name: Run ui-core and ui-react unit tests
        run: npm run test:ui:unit

      - name: Run ui-sortable, collaboration, light-code-editor and markdown-editor tests
        run: npm run test:packages

  react-19-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @editora/ui-react's peerDependencies claim "react": ">=16.8 <21" -
      # a range that includes React 19 - but nothing anywhere actually
      # builds or tests against it; the whole repo's own tooling (this
      # workflow's matrix included) only ever installs React 18. That gap
      # is exactly what let a real React 19 incompatibility (ui-react's
      # Sidebar bundle crashing on load - unrelated to any code a consumer
      # writes) ship undetected until an external integration hit it. This
      # job overrides the hoisted React install for this runner only - it
      # does not touch package.json or the committed lockfile - then
      # rebuilds and retests the React-facing packages against it.
      - name: Install React 19 (override, not persisted)
        run: npm install react@19 react-dom@19 --no-save --legacy-peer-deps

      - name: Build ui-core
        run: npm run build -w @editora/ui-core

      - name: Build ui-react
        run: npm run build -w @editora/ui-react

      - name: Test ui-react against React 19
        run: npm test --prefix packages/ui-react
