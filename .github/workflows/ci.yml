name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify component registry is up to date
        run: npm run check:components

      - name: Verify custom element registrations are complete
        run: npm run check:element-registrations

      - name: Run linter
        run: npm run lint
      
      - name: Run type checking
        run: npm run typecheck
      
      - name: Build packages
        run: npm run build

      # Gzipped bytes each @editora/ui-react/<Name> entry loads up front, against ui-size-budgets.json.
      - name: Check ui-react size budgets
        run: npm run check:ui-size

      - name: Test release scripts
        run: npm run test:scripts

      - name: Generate plugin typings
        run: npm run build:types

      - name: Verify package contents
        run: npm run verify:packages
      
      - name: Run tests
        run: npm test

      - name: Run UI package tests
        run: npm run test:ui

      - name: Run core package tests
        run: npm run test:core:unit

      - name: Run icons, react-icons and toast tests
        run: npm run test:libs

      # ui-core, ui-react, ui-sortable and collaboration each have a vitest suite that nothing ran
      # here (test:ui only type-checks the declarations), so regressions in them went unnoticed.
      - name: Run ui-core and ui-react unit tests
        run: npm run test:ui:unit

      - name: Run ui-sortable, collaboration, light-code-editor and markdown-editor tests
        run: npm run test:packages

  react-19-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @editora/ui-react's peerDependencies claim "react": ">=16.8 <21" -
      # a range that includes React 19 - but nothing anywhere actually
      # builds or tests against it; the whole repo's own tooling (this
      # workflow's matrix included) only ever installs React 18. That gap
      # is exactly what let a real React 19 incompatibility (ui-react's
      # Sidebar bundle crashing on load - unrelated to any code a consumer
      # writes) ship undetected until an external integration hit it. This
      # job overrides the hoisted React install for this runner only - it
      # does not touch package.json or the committed lockfile - then
      # rebuilds and retests the React-facing packages against it.
      - name: Install React 19 (override, not persisted)
        run: npm install react@19 react-dom@19 --no-save --legacy-peer-deps

      - name: Build ui-core
        run: npm run build -w @editora/ui-core

      - name: Build ui-react
        run: npm run build -w @editora/ui-react

      - name: Test ui-react against React 19
        run: npm test --prefix packages/ui-react

  # Real-browser tests for ui-core / ui-react (e2e-ui/): a React 19 app built from the packages'
  # source, driven by Playwright in Chromium, Firefox and WebKit. Covers what jsdom cannot:
  # form association, focus and keyboard patterns, layout, server-rendered markup, icons.
  browser-tests:
    # Pinned: Playwright 1.58 does not support ubuntu-latest (26.04) yet, and screenshot
    # baselines must come from the same image they are compared on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: e2e-ui/package-lock.json

      - name: Install e2e-ui
        run: npm ci --prefix e2e-ui

      - name: Install browsers
        working-directory: e2e-ui
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        working-directory: e2e-ui
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-report
          path: e2e-ui/playwright-report
          retention-days: 7

  # axe over every Storybook story, unthemed and with the real light theme.
  a11y-stories:
    # Pinned: Playwright 1.58 does not support ubuntu-latest (26.04) yet, and screenshot
    # baselines must come from the same image they are compared on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Build Storybook
        run: npx storybook build --output-dir e2e-ui/storybook-static
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Install e2e-ui
        run: npm ci --prefix e2e-ui

      - name: Install Chromium
        working-directory: e2e-ui
        run: npx playwright install --with-deps chromium

      - name: Run axe over all stories
        working-directory: e2e-ui
        run: npm run test:a11y

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-stories-report
          path: e2e-ui/playwright-report-a11y
          retention-days: 7

  # Screenshot comparisons per theme and density. Baselines are Linux-only and come from the
  # "Update visual baselines" workflow; until they are committed these tests are skipped.
  visual:
    # Pinned: Playwright 1.58 does not support ubuntu-latest (26.04) yet, and screenshot
    # baselines must come from the same image they are compared on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: e2e-ui/package-lock.json

      - name: Install e2e-ui
        run: npm ci --prefix e2e-ui

      - name: Install Chromium
        working-directory: e2e-ui
        run: npx playwright install --with-deps chromium

      - name: Compare screenshots
        working-directory: e2e-ui
        run: npm run test:visual

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: e2e-ui/test-results
          retention-days: 7

  # The Tallyhawk reference app (examples/reference-app), built for production from the packages'
  # source: its size budget, user journeys in three browsers, axe on every screen, and screenshots
  # (compared once Linux baselines exist; see the "Update visual baselines" workflow).
  reference-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: examples/reference-app/package-lock.json

      - name: Install the reference app
        run: npm ci --prefix examples/reference-app

      - name: Install browsers
        working-directory: examples/reference-app
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        working-directory: examples/reference-app
        run: npm run build

      - name: Check the size budget
        working-directory: examples/reference-app
        run: npm run check:size

      - name: Journeys, accessibility and screenshots
        working-directory: examples/reference-app
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-app-report
          path: |
            examples/reference-app/playwright-report
            examples/reference-app/test-results
          retention-days: 7
