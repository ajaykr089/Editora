<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order · Copperline</title>
    <meta name="description" content="Copperline: an admin template in plain HTML, built with Editora UI web components and the Editora rich-text editor." />
  </head>
  <body>
    <ui-layout variant="shell" sidebar-label="Main navigation">
      <ui-app-header slot="header" bordered show-menu-button="narrow">
        <a slot="start" class="cl-brand" href="./" aria-label="Copperline, dashboard">
          <svg class="cl-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ui-color-primary)" /><path d="M21 11.5a7 7 0 1 0 0 9" fill="none" stroke="var(--ui-color-foreground-on-primary, #fff)" stroke-width="2.6" stroke-linecap="round" /></svg>
          <span>Copperline</span>
        </a>
        <div slot="end" class="cl-actions">
          <ui-button variant="ghost" size="sm" data-action="toggle-theme" aria-label="Use dark theme"><ui-icon name="moon" decorative></ui-icon></ui-button>
          <ui-button variant="ghost" size="sm" aria-label="Notifications"><ui-icon name="bell" decorative></ui-icon></ui-button>
          <ui-avatar initials="SL" size="sm" alt="Sana Lindqvist" variant="soft"></ui-avatar>
        </div>
      </ui-app-header>
      <ui-sidebar slot="sidebar" variant="minimal" aria-label="Main navigation"></ui-sidebar>
      <main slot="content" class="cl-content" id="main">
        <div class="cl-page cl-narrow">
          <ui-breadcrumb>
            <div class="item" data-href="./orders.html">Orders</div>
            <div class="item" id="crumb">Order</div>
          </ui-breadcrumb>
          <div class="cl-head">
            <div><h1 id="title">Order</h1><p id="subtitle">Loading…</p></div>
            <div class="cl-actions">
              <ui-badge id="status-badge" variant="soft"></ui-badge>
              <ui-button variant="secondary" icon="printer" id="print">Print</ui-button>
              <ui-button id="advance" class="cl-hidden"></ui-button>
              <ui-button variant="secondary" tone="danger" id="refund" class="cl-hidden">Refund</ui-button>
            </div>
          </div>
          <ui-alert id="error" tone="danger" title="That did not work" class="cl-hidden" dismissible></ui-alert>
          <div class="cl-aside">
            <div class="cl-stack">
              <ui-card>
                <h2 class="cl-card-title">Items</h2>
                <table class="cl-lines"><thead><tr><th>Item</th><th data-align="end">Qty</th><th data-align="end">Price</th><th data-align="end">Amount</th></tr></thead><tbody id="lines"></tbody><tfoot id="totals"></tfoot></table>
              </ui-card>
              <ui-card>
                <h2 class="cl-card-title">History</h2>
                <ui-timeline id="timeline" aria-label="Order history"></ui-timeline>
              </ui-card>
            </div>
            <ui-card>
              <h2 class="cl-card-title">Customer</h2>
              <dl class="cl-dl" id="customer"></dl>
            </ui-card>
          </div>
          <ui-dialog id="refund-dialog" title="Refund this order?" submit-text="Refund" cancel-text="Keep it">
            <p class="cl-muted" id="refund-text"></p>
            <ui-textarea id="refund-reason" label="Reason (optional)" rows="3"></ui-textarea>
          </ui-dialog>
        </div>
      </main>
    </ui-layout>
    <script type="module" src="./src/order.ts"></script>
  </body>
</html>
