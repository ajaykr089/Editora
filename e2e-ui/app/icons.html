<!doctype html><html><body><ui-button id="b" icon="search">Find</ui-button><ui-icon id="i" name="settings"></ui-icon><script type="module">
const { loadIcons } = await import('@editora/ui-core');
const first = { icon: !!document.getElementById('i').shadowRoot.querySelector('svg'), fallback: !!document.getElementById('i').shadowRoot.querySelector('.fallback') };
// Wait for the set itself (a fixed delay was too short on a loaded machine), then one render pass.
await loadIcons();
await new Promise((r) => setTimeout(r, 50));
window.result = { first, later: { icon: !!document.getElementById('i').shadowRoot.querySelector('svg'), button: !!document.getElementById('b').shadowRoot.querySelector('ui-icon')?.shadowRoot?.querySelector('svg') } };
</script></body></html>
